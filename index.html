<style>
@font-face{font-family:Chewy;src:url('assets/fonts/Chewy-Regular.ttf') format('truetype');font-display:swap}
:root{color-scheme:light;background:#6dbefd;--blue:#6dbefd;--ink:#111210;--paper:#fffefb}*{box-sizing:border-box}body{margin:0;background:var(--blue);color:var(--ink)}
.stage{min-height:calc(100vh - 56px);min-height:calc(100svh - 56px);display:grid;place-items:center;padding:24px 18px;overflow:hidden;perspective:900px}.scene{display:grid;grid-template-columns:minmax(150px,1fr) minmax(0,560px) minmax(150px,1fr);grid-template-areas:'photo hero pro' 'game hero connect';align-items:center;gap:24px clamp(24px,5vw,90px);width:min(1240px,100%)}
.hero{grid-area:hero;display:flex;flex-direction:column;align-items:center;min-width:0}.name{cursor:pointer;z-index:2;margin:0 0 8px;font:400 clamp(44px,min(12vw,10svh),106px)/.9 Chewy,cursive;text-align:center;letter-spacing:.025em;text-transform:uppercase;user-select:none}.name-line{display:block}.name-line:first-child{transform:rotate(-6deg)}.name-line:last-child{margin-top:.08em;transform:rotate(3deg)}.name-letter{display:inline-block}.name-letter:nth-child(even){transform:translateY(-.035em) rotate(5deg)}.name-letter:nth-child(3n){transform:rotate(-7deg)}
.portrait{width:min(560px,100%,67svh);transform:translate3d(var(--x,0),var(--y,0),0) rotateX(var(--rx,0)) rotateY(var(--ry,0));transition:transform .22s ease-out}.grab{display:block;width:100%;padding:0;border:0;background:transparent;cursor:grab;touch-action:none;transform-origin:50% 65%}.grab.is-dragging{cursor:grabbing}.grab.is-dragging .face{animation-play-state:paused}.face{position:relative;animation:float 1.85s ease-in-out infinite}.portrait img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none;mask-image:linear-gradient(to right,transparent,#000 8%,#000 92%,transparent),linear-gradient(to bottom,transparent,#000 7%,#000 94%,transparent);mask-composite:intersect}.eyes{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.expression-brow,.expression-mouth,.laugh-eyes{display:none}[data-expression=curious] .expression-brow,[data-expression=laugh] .expression-mouth,[data-expression=surprised] .expression-mouth{display:inline}[data-expression=laugh] .laugh-eyes{display:inline}[data-expression=laugh] .pupil{opacity:0}[data-expression=surprised] .pupil>ellipse:first-child{rx:16px;ry:23px}[data-expression=surprised] .pupil>ellipse:last-child{opacity:0}.laugh-mouth,.surprised-mouth{display:none}[data-expression=laugh] .laugh-mouth,[data-expression=surprised] .surprised-mouth{display:inline}
.me-note{width:128px;height:68px;margin:-8px 0 0 -105px;overflow:visible;pointer-events:none}.me-note text{fill:currentColor;font:25px Chewy,cursive}
.tile{text-align:center;justify-self:center;width:100%;max-width:210px}.tile a{display:block;padding:14px 4px;color:inherit;text-decoration:none;border-radius:20px}.tile h2{margin:0 0 14px;font:400 clamp(22px,2.1vw,30px)/1.1 Chewy,cursive}.icon{display:block;width:clamp(88px,9vw,126px);height:auto;margin:auto;overflow:visible;fill:var(--paper);stroke:currentColor;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;transition:transform .26s ease}.tile a:hover .icon,.tile a:focus-visible .icon{transform:translateY(-7px) rotate(-5deg)}.photo{grid-area:photo;transform:rotate(-7deg)}.pro{grid-area:pro;transform:rotate(6deg)}.game{grid-area:game;transform:rotate(5deg)}.connect{grid-area:connect;transform:rotate(-5deg)}
a:focus-visible,button:focus-visible,.name:focus-visible{outline:3px dashed var(--ink);outline-offset:6px}
@keyframes float{0%,100%{transform:translateY(12px) rotate(-2.5deg)}50%{transform:translateY(-12px) rotate(2.5deg)}}
@media(max-width:760px){.stage{padding:32px 18px 44px;overflow:auto}.scene{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-areas:'hero hero' 'photo pro' 'game connect';gap:38px 20px}.tile h2{font-size:24px}.icon{width:96px}.portrait{width:min(560px,92vw,58svh)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.portrait{transform:none!important}}
.topbar { display: flex; width: min(1320px, 100%); min-height: 56px; margin: 0 auto; padding: 18px clamp(16px, 3vw, 32px); align-items: center; justify-content: space-between; gap: 18px; }
.topbar a { color: inherit; font-size: 12px; font-weight: 600; letter-spacing: .035em; text-decoration: none; opacity: .58; transition: opacity .2s ease; }
.topbar a:hover, .topbar a[aria-current="page"] { opacity: 1; }
.section-links { display: flex; min-width: 0; align-items: center; gap: clamp(10px, 2vw, 24px); overflow-x: auto; scrollbar-width: none; white-space: nowrap; }
.section-links::-webkit-scrollbar { display: none; }
.section-links a { flex: none; }
.topbar { font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
@media (max-width: 720px) {
    .topbar { padding: 15px 10px; gap: 10px; }
    .topbar a { font-size: 10px; }
    .section-links { gap: 9px; }
}
</style>

<script>
const portrait=document.querySelector('.portrait'),grab=document.querySelector('.grab'),reduced=matchMedia('(prefers-reduced-motion:reduce)'),letters=[...document.querySelectorAll('.name-letter')];let letterAnimations=[];
function bounceName(){if(reduced.matches)return;letterAnimations.forEach(a=>a.cancel());letterAnimations=letters.map((el,i)=>el.animate([{translate:'0 0',scale:'1'},{translate:'0 -.25em',scale:'1.08 .94',offset:.35},{translate:'0 .04em',scale:'.96 1.06',offset:.72},{translate:'0 0',scale:'1'}],{duration:520,delay:i*65,easing:'cubic-bezier(.22,.7,.3,1)'}))}document.querySelector('.name').addEventListener('pointerenter',bounceName);document.querySelector('.name').addEventListener('focus',bounceName);
let expressionTimer,lastExpression='';function randomExpression(){clearTimeout(expressionTimer);const choices=['curious','laugh','surprised'].filter(x=>x!==lastExpression);lastExpression=choices[Math.floor(Math.random()*choices.length)];grab.dataset.expression=lastExpression;expressionTimer=setTimeout(()=>delete grab.dataset.expression,1500)}
let drag=null,spring=null,suppress=false;function springBack(x,y){spring?.cancel();grab.style.transform='';if(reduced.matches)return;spring=grab.animate([{transform:`translate(${x}px,${y}px) rotate(${x*.12}deg)`},{transform:`translate(${-x*.32}px,${-y*.32}px) rotate(${-x*.05}deg)`,offset:.32},{transform:`translate(${x*.14}px,${y*.14}px)`,offset:.6},{transform:'none'}],{duration:850,easing:'ease-in-out'})}grab.addEventListener('pointerdown',e=>{if(!e.isPrimary||e.button!==0)return;spring?.cancel();suppress=false;drag={id:e.pointerId,sx:e.clientX,sy:e.clientY,x:0,y:0,moved:false};grab.setPointerCapture(e.pointerId);grab.classList.add('is-dragging')});grab.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy,limit=Math.min(85,grab.offsetWidth*.18);drag.moved||=Math.hypot(dx,dy)>7;drag.x=limit*Math.tanh(dx/limit);drag.y=limit*Math.tanh(dy/limit);grab.style.transform=`translate(${drag.x}px,${drag.y}px) rotate(${drag.x*.12}deg)`});function endDrag(e){if(!drag||(e?.pointerId!==undefined&&e.pointerId!==drag.id))return;const d=drag;drag=null;suppress=d.moved||e?.type!=='pointerup';grab.classList.remove('is-dragging');springBack(d.x,d.y)}grab.addEventListener('pointerup',endDrag);grab.addEventListener('pointercancel',endDrag);grab.addEventListener('click',e=>{if(suppress&&e.detail!==0){suppress=false;return}randomExpression()});
const eyes=[...document.querySelectorAll('.eye')].map(el=>({el,pupil:el.querySelector('.pupil'),x:0,y:0}));let pointer,frame=0,last=0;function follow(t){const smoothing=1-Math.exp(-Math.min(t-last||16,64)/65);last=t;for(const eye of eyes){const matrix=eye.el.getScreenCTM();if(!matrix)continue;const local=pointer.matrixTransform(matrix.inverse()),angle=Math.atan2(local.y,local.x),reach=Math.min(1,Math.hypot(local.x,local.y)/200);eye.x+=(Math.cos(angle)*28*reach-eye.x)*smoothing;eye.y+=(Math.sin(angle)*15*reach-eye.y)*smoothing;eye.pupil.setAttribute('transform',`translate(${eye.x} ${eye.y})`)}frame=requestAnimationFrame(follow)}window.addEventListener('pointermove',e=>{if(reduced.matches||e.pointerType==='touch')return;pointer=new DOMPoint(e.clientX,e.clientY);if(!frame)frame=requestAnimationFrame(follow);const x=Math.max(-1,Math.min(1,e.clientX/innerWidth*2-1)),y=Math.max(-1,Math.min(1,e.clientY/innerHeight*2-1));portrait.style.setProperty('--x',`${x*12}px`);portrait.style.setProperty('--y',`${y*10}px`);portrait.style.setProperty('--rx',`${-y*9}deg`);portrait.style.setProperty('--ry',`${x*12}deg`)},{passive:true});
</script>
