    <style>
        @font-face { font-family: Chewy; src: url('assets/fonts/Chewy-Regular.ttf') format('truetype'); font-display: swap; }
        :root { color-scheme: light; --blue: #6dbefd; --ink: #111210; --paper: #fffefb; --yellow: #ffe45c; }
        * { box-sizing: border-box; }
        html { scrollbar-gutter: stable; }
        body { margin: 0; min-width: 320px; min-height: 100svh; background: var(--blue); color: var(--ink); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        .topbar { display: flex; width: min(1320px, 100%); min-height: 56px; margin: 0 auto; padding: 18px clamp(16px, 3vw, 32px); align-items: center; justify-content: space-between; gap: 18px; }
        .topbar a { color: inherit; font-size: 12px; font-weight: 600; letter-spacing: .035em; text-decoration: none; opacity: .58; transition: opacity .2s ease; }
        .topbar a:hover, .topbar a[aria-current="page"] { opacity: 1; }
        .section-links { display: flex; min-width: 0; align-items: center; gap: clamp(10px, 2vw, 24px); overflow-x: auto; scrollbar-width: none; white-space: nowrap; }
        .section-links::-webkit-scrollbar { display: none; }
        .section-links a { flex: none; }
        .links-stage { width: min(960px, 100%); margin: 0 auto; padding: clamp(48px, 8vw, 105px) clamp(20px, 5vw, 60px) 80px; }
        h1 { margin: 0 0 50px; font: 400 clamp(68px, 11vw, 116px)/.82 Chewy, cursive; letter-spacing: -.02em; text-transform: uppercase; transform: rotate(-3deg); }
        .link-grid { display: grid; max-width: 700px; grid-template-columns: repeat(2, 1fr); gap: 25px; }
        .link-card { position: relative; min-height: 205px; padding: 25px; border: 3px solid var(--ink); border-radius: 21px 26px 20px 24px; background: var(--paper); box-shadow: 6px 7px 0 var(--ink); color: inherit; text-decoration: none; transform: rotate(var(--tilt)); transition: transform .22s ease, background .22s ease; }
        .link-card:nth-child(1) { --tilt: -2deg; }
        .link-card:nth-child(2) { --tilt: 1.5deg; }
        .link-card:hover { z-index: 1; background: var(--yellow); transform: translateY(-7px) rotate(0); }
        .number { display: block; margin-bottom: 48px; font: 28px Chewy, cursive; opacity: .58; }
        .link-card h2 { margin: 0; font: 31px/1 Chewy, cursive; }
        .arrow { position: absolute; right: 20px; bottom: 16px; font: 30px Chewy, cursive; }
        a:focus-visible { outline: 3px dashed var(--ink); outline-offset: 5px; }
        @media (max-width: 720px) {
            .topbar { padding: 15px 10px; gap: 10px; }
            .topbar a { font-size: 10px; }
            .section-links { gap: 9px; }
            .link-grid { grid-template-columns: 1fr; gap: 25px; }
            .link-card { min-height: 190px; }
            .number { margin-bottom: 25px; }
        }
        @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
    </style>
