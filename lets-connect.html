<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#6dbefd">
    <title>Let’s Connect · Jeff Jiang</title>
    <link rel="preload" href="assets/fonts/Chewy-Regular.ttf" as="font" type="font/ttf" crossorigin>
    <style>
        @font-face { font-family: Chewy; src: url('assets/fonts/Chewy-Regular.ttf') format('truetype'); font-display: swap; }
        :root { color-scheme: light; --blue: #6dbefd; --ink: #111210; --paper: #fffefb; --yellow: #ffe45c; }
        * { box-sizing: border-box; }
        html { scrollbar-gutter: stable; }
        body { margin: 0; min-width: 320px; min-height: 100svh; background: var(--blue); color: var(--ink); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        button, input, textarea { font: inherit; color: inherit; }
        .topbar { display: flex; width: min(1320px, 100%); min-height: 56px; margin: 0 auto; padding: 18px clamp(16px, 3vw, 32px); align-items: center; justify-content: space-between; gap: 18px; }
        .topbar a { color: inherit; font-size: 12px; font-weight: 600; letter-spacing: .035em; text-decoration: none; opacity: .58; transition: opacity .2s ease; }
        .topbar a:hover, .topbar a[aria-current="page"] { opacity: 1; }
        .section-links { display: flex; min-width: 0; align-items: center; gap: clamp(10px, 2vw, 24px); overflow-x: auto; scrollbar-width: none; white-space: nowrap; }
        .section-links::-webkit-scrollbar { display: none; }
        .section-links a { flex: none; }

        .contact-stage { display: grid; width: min(1180px, 100%); min-height: calc(100svh - 56px); margin: 0 auto; padding: 42px clamp(20px, 5vw, 66px) 70px; grid-template-columns: minmax(250px, .72fr) minmax(450px, 1.28fr); gap: clamp(46px, 7vw, 100px); align-items: center; }
        .intro { align-self: center; }
        h1 { width: min-content; margin: 0; font: 400 clamp(70px, 9vw, 126px)/.78 Chewy, cursive; letter-spacing: -.025em; text-transform: uppercase; transform: rotate(-3deg); }
        h1 span { display: block; }
        .intro-copy { max-width: 330px; margin: 28px 0 0; font-size: 16px; line-height: 1.65; }
        .socials { display: flex; gap: 12px; margin-top: 29px; }
        .social-link { display: grid; width: 54px; height: 54px; border: 3px solid var(--ink); border-radius: 50%; place-items: center; background: var(--paper); box-shadow: 3px 4px 0 var(--ink); color: var(--ink); transition: transform .2s ease, background .2s ease; }
        .social-link:hover { background: var(--yellow); transform: translateY(-4px) rotate(-6deg); }
        .social-link svg { width: 25px; height: 25px; fill: currentColor; }
        .social-link.email svg { fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

        .contact-card { padding: clamp(25px, 4vw, 40px); border: 3px solid var(--ink); border-radius: 22px 26px 20px 25px; background: var(--paper); box-shadow: 8px 9px 0 var(--ink); transform: rotate(1deg); }
        .contact-card h2 { margin: 0 0 24px; font: 38px/1 Chewy, cursive; letter-spacing: .025em; }
        .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .field { display: block; margin-bottom: 16px; }
        .field span { display: block; margin: 0 0 7px; font-size: 12px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; }
        input, textarea { display: block; width: 100%; border: 2px solid var(--ink); border-radius: 8px; background: #eef7fd; outline: 0; transition: background .2s, box-shadow .2s; }
        input { height: 51px; padding: 0 14px; }
        textarea { min-height: 190px; padding: 14px; line-height: 1.55; resize: vertical; }
        input:focus, textarea:focus { background: #fff; box-shadow: 4px 4px 0 var(--blue); }
        input::placeholder, textarea::placeholder { color: #6f7c85; opacity: 1; }
        .form-actions { display: flex; flex-wrap: wrap; gap: 13px; margin-top: 8px; }
        .form-actions button { min-width: 112px; padding: 11px 20px; border: 3px solid var(--ink); border-radius: 999px; cursor: pointer; font: 20px Chewy, cursive; transition: transform .2s, background .2s; }
        .send { background: var(--yellow); box-shadow: 3px 4px 0 var(--ink); }
        .reset { background: var(--paper); }
        .form-actions button:hover { transform: translateY(-3px) rotate(-2deg); }
        a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px dashed var(--ink); outline-offset: 4px; }

        @media (max-width: 800px) {
            .contact-stage { grid-template-columns: 1fr; min-height: auto; gap: 44px; padding-top: 50px; }
            h1 { width: auto; font-size: clamp(66px, 20vw, 104px); }
            .intro-copy { max-width: 460px; }
            .contact-card { transform: rotate(.5deg); }
        }
        @media (max-width: 720px) {
            .topbar { padding: 15px 10px; gap: 10px; }
            .topbar a { font-size: 10px; }
            .section-links { gap: 9px; }
        }
        @media (max-width: 480px) {
            .contact-stage { padding: 38px 16px 54px; }
            .field-row { grid-template-columns: 1fr; gap: 0; }
            .contact-card { padding: 24px 20px; box-shadow: 6px 7px 0 var(--ink); transform: none; }
            textarea { min-height: 165px; }
            .form-actions button { min-width: 100px; }
        }
        @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
    </style>
</head>
<body>
    <nav class="topbar" aria-label="Page navigation">
        <a href="index.html">Home</a>
        <div class="section-links"><a href="photography.html">Photography</a><a href="professional.html">Professional</a><a href="two-truths-one-lie.html">2 Truths 1 Lie</a><a href="lets-connect.html" aria-current="page">Connect</a><a href="links.html">Links</a></div>
    </nav>

    <main class="contact-stage">
        <section class="intro" aria-labelledby="page-title">
            <h1 id="page-title"><span>Get in</span><span>touch</span></h1>
            <p class="intro-copy">Have an idea, a question, or just want to say hello? Send me a message or find me online.</p>
            <div class="socials" aria-label="Contact links">
                <a class="social-link" href="https://www.linkedin.com/in/jeffbc-jiang-0319/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.2 7.3H1.6V22h3.6V7.3ZM3.4 1A2.1 2.1 0 1 0 3.4 5.2 2.1 2.1 0 0 0 3.4 1ZM22.4 13.5c0-4.4-2.4-6.5-5.5-6.5-2.5 0-3.7 1.4-4.3 2.4V7.3H9V22h3.6v-7.3c0-1.9.4-3.8 2.8-3.8s2.5 2.2 2.5 3.9V22h3.6l.9-8.5Z"/></svg>
                </a>
                <a class="social-link" href="https://www.github.com/Ace-etn1" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" d="M12 1.4a10.8 10.8 0 0 0-3.4 21c.5.1.7-.2.7-.5v-2c-2.8.6-3.4-1.2-3.4-1.2-.5-1.2-1.1-1.5-1.1-1.5-.9-.6.1-.6.1-.6 1 .1 1.6 1 1.6 1 .9 1.6 2.4 1.1 2.9.9.1-.7.4-1.1.6-1.4-2.3-.3-4.7-1.1-4.7-5A4 4 0 0 1 6.4 9c-.1-.3-.5-1.3.1-2.8 0 0 .9-.3 3 1.1a10.4 10.4 0 0 1 5.4 0c2.1-1.4 3-1.1 3-1.1.6 1.5.2 2.5.1 2.8a4 4 0 0 1 1.1 3c0 3.9-2.4 4.7-4.7 5 .4.3.7 1 .7 1.9v3c0 .3.2.6.7.5A10.8 10.8 0 0 0 12 1.4Z" clip-rule="evenodd"/></svg>
                </a>
                <a class="social-link email" href="mailto:jeffbc0319@gmail.com" aria-label="Email Jeff">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="4.5" width="19" height="15" rx="2"/><path d="m4 7 8 6 8-6"/></svg>
                </a>
            </div>
        </section>

        <section class="contact-card" aria-labelledby="form-title">
            <h2 id="form-title">Send a message</h2>
            <form id="contact-form">
                <div class="field-row">
                    <label class="field"><span>Name</span><input name="name" autocomplete="name" placeholder="Your name" required></label>
                    <label class="field"><span>Email</span><input name="email" type="email" autocomplete="email" placeholder="Your email" required></label>
                </div>
                <label class="field"><span>Message</span><textarea name="message" placeholder="Write your message" required></textarea></label>
                <div class="form-actions">
                    <button class="send" type="submit">Send</button>
                    <button class="reset" type="reset">Reset</button>
                </div>
            </form>
        </section>
    </main>

    <script>
        document.querySelector('#contact-form').addEventListener('submit', event => {
            event.preventDefault();
            const data = new FormData(event.currentTarget);
            const name = data.get('name').trim();
            const email = data.get('email').trim();
            const message = data.get('message').trim();
            const subject = encodeURIComponent(`Website message from ${name}`);
            const body = encodeURIComponent(`Name: ${name}\nEmail: ${email}\n\n${message}`);
            window.location.href = `mailto:jeffbc0319@gmail.com?subject=${subject}&body=${body}`;
        });
    </script>
</body>
</html>
