<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#6dbefd">
    <title>Photography · Jeff Jiang</title>
    <style>
        :root {
            color-scheme: light;
            --blue: #6dbefd;
            --ink: #101820;
            --frame: #202225;
        }

        * { box-sizing: border-box; }
        html { height: 100%; }

        body {
            margin: 0;
            min-width: 320px;
            height: 100%;
            overflow: hidden;
            background: var(--blue);
            color: var(--ink);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        button, a { -webkit-tap-highlight-color: transparent; }

        .topbar {
            position: fixed;
            z-index: 10;
            top: 0;
            left: 50%;
            display: flex;
            width: min(1320px, 100%);
            min-height: 56px;
            margin: 0 auto;
            padding: 18px clamp(16px, 3vw, 32px);
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            transform: translateX(-50%);
        }

        .topbar a {
            color: var(--ink);
            font-size: 12px;
            font-weight: 600;
            letter-spacing: .035em;
            text-decoration: none;
            opacity: .58;
            transition: opacity .2s ease;
        }
        .topbar a:hover, .topbar a[aria-current="page"] { opacity: 1; }
        .section-links { display: flex; min-width: 0; align-items: center; gap: clamp(10px, 2vw, 24px); overflow-x: auto; scrollbar-width: none; white-space: nowrap; }
        .section-links::-webkit-scrollbar { display: none; }
        .section-links a { flex: none; }

        .gallery {
            position: relative;
            width: 100%;
            height: 100vh;
            height: 100svh;
            overflow: hidden;
            perspective: var(--perspective, 1200px);
            touch-action: none;
            overscroll-behavior: contain;
        }

        .cylinder {
            position: absolute;
            inset: 0;
            transform: translateZ(var(--radius, 800px));
            transform-style: preserve-3d;
            pointer-events: none;
        }

        .photo {
            position: absolute;
            left: 50%;
            top: 27%;
            display: block;
            width: max-content;
            height: max-content;
            margin: 0;
            padding: 4px;
            border: 1px solid #303236;
            border-radius: 9px;
            background: var(--frame);
            box-shadow: 0 2px 10px rgba(0, 0, 0, .22);
            cursor: zoom-in;
            overflow: hidden;
            backface-visibility: hidden;
            will-change: transform;
            transition: box-shadow .25s ease;
        }

        .photo[data-lane="bottom"] { top: 73%; }

        .photo img {
            display: block;
            width: auto;
            height: auto;
            max-width: min(46vw, 550px);
            max-height: min(37svh, 350px);
            border-radius: 5px;
            object-fit: contain;
            transition: transform .4s cubic-bezier(.2, .7, .2, 1), filter .3s ease;
        }

        .photo:hover img,
        .photo:focus-visible img {
            transform: scale(1.012);
            filter: brightness(1.05);
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        a:focus-visible,
        button:focus-visible {
            outline: 2px solid var(--ink);
            outline-offset: 3px;
        }

        dialog {
            width: 100vw;
            max-width: none;
            height: 100svh;
            max-height: none;
            margin: 0;
            padding: 0;
            border: 0;
            background: transparent;
            overflow: hidden;
        }

        dialog::backdrop {
            background: rgba(0, 0, 0, .76);
            backdrop-filter: blur(5px);
        }

        .lightbox {
            display: grid;
            width: 100%;
            height: 100%;
            padding: 50px;
            place-items: center;
        }

        .preview-shell {
            position: relative;
            display: inline-grid;
            max-width: calc(100vw - 100px);
            max-height: calc(100svh - 100px);
            padding: 10px;
            border-radius: 4px;
            place-items: center;
            background: rgba(31, 34, 36, .96);
            box-shadow: 0 1em 3em .5em rgba(0, 0, 0, .38);
        }

        .preview-shell img {
            display: block;
            max-width: min(82vw, 1180px);
            max-height: calc(100svh - 120px);
            object-fit: contain;
        }

        .close,
        .nav-button {
            position: absolute;
            z-index: 2;
            display: grid;
            width: 48px;
            height: 48px;
            padding: 0;
            border: 0;
            place-items: center;
            background: rgba(14, 14, 14, .42);
            color: white;
            font: 300 32px/1 Arial, sans-serif;
            cursor: pointer;
            opacity: .62;
            transition: opacity .2s ease, background .2s ease;
        }

        .close:hover,
        .nav-button:hover {
            background: rgba(0, 0, 0, .7);
            opacity: 1;
        }

        .close { top: 10px; right: 10px; }
        .nav-button { top: 50%; height: 84px; transform: translateY(-50%); }
        .prev { left: 10px; }
        .next { right: 10px; }

        @media (max-width: 720px) {
            .topbar { padding: 15px 10px; gap: 10px; }
            .topbar a { font-size: 10px; }
            .section-links { gap: 9px; }
            .photo { top: 29%; padding: 3px; border-radius: 7px; }
            .photo[data-lane="bottom"] { top: 72%; }
            .photo img { max-width: 80vw; max-height: 30svh; border-radius: 4px; }
            .lightbox { padding: 16px; }
            .preview-shell {
                max-width: calc(100vw - 24px);
                max-height: calc(100svh - 70px);
                padding: 6px;
            }
            .preview-shell img {
                max-width: calc(100vw - 36px);
                max-height: calc(100svh - 82px);
            }
            .close { top: 6px; right: 6px; }
            .nav-button { height: 68px; }
            .prev { left: 6px; }
            .next { right: 6px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { transition: none !important; }
        }
    </style>
</head>
<body>
    <nav class="topbar" aria-label="Page navigation">
        <a href="index.html">Home</a>
        <div class="section-links"><a href="photography.html" aria-current="page">Photography</a><a href="professional.html">Professional</a><a href="two-truths-one-lie.html">2 Truths 1 Lie</a><a href="lets-connect.html">Connect</a><a href="links.html">Links</a></div>
    </nav>
    <main>
        <section class="gallery" aria-label="Jeff Jiang photography gallery" tabindex="0">
            <div class="cylinder"></div>
            <p class="sr-only">Scroll, swipe, or use the arrow keys to move through the photographs. Select a photograph to enlarge it.</p>
        </section>
    </main>

    <dialog aria-label="Photo viewer">
        <div class="lightbox">
            <div class="preview-shell">
                <button class="close" type="button" aria-label="Close photo">×</button>
                <button class="nav-button prev" type="button" aria-label="Previous photo">‹</button>
                <img alt="">
                <button class="nav-button next" type="button" aria-label="Next photo">›</button>
            </div>
        </div>
    </dialog>

    <script>
        const photos = [
            { full: '20230908_115913.jpg', thumb: '20230908_115913.webp' },
            { full: '20240304_140749 v2.png', thumb: '20240304_140749 v2.webp' },
            { full: '20240324_211430.jpg', thumb: '20240324_211430.webp' },
            { full: '20240514_144600.jpg', thumb: '20240514_144600.webp' },
            { full: '20240519_003313.jpg', thumb: '20240519_003313.webp' },
            { full: '20240519_004242.jpg', thumb: '20240519_004242.webp' },
            { full: '20240625_020658_DSC03059.JPG', thumb: '20240625_020658_DSC03059.webp' },
            { full: '20250523_165329.jpg', thumb: '20250523_165329.webp' },
            { full: 'DSC00849.jpg', thumb: 'DSC00849.webp' },
            { full: 'DSC01696.jpg', thumb: 'DSC01696.webp' },
            { full: 'DSC022751.jpg', thumb: 'DSC022751.webp' },
            { full: 'DSC02601.jpg', thumb: 'DSC02601.webp' },
            { full: 'DSC02607.jpg', thumb: 'DSC02607.webp' },
            { full: 'DSC08327.JPG', thumb: 'DSC08327.webp' },
            { full: 'DSC08547.JPG', thumb: 'DSC08547.webp' },
            { full: 'DSC08567.JPG', thumb: 'DSC08567.webp' },
            { full: 'DSC09054_1.JPG', thumb: 'DSC09054_1.webp' },
            { full: 'DSC09832.JPG', thumb: 'DSC09832.webp' },
            { full: 'DSC09936.JPG', thumb: 'DSC09936.webp' },
            { full: 'DSC09962.JPG', thumb: 'DSC09962.webp' },
            { full: 'mmexport1754718895013.jpg', thumb: 'mmexport1754718895013.webp' },
            { full: 'mmexport1754719889603.jpg', thumb: 'mmexport1754719889603.webp' },
            { full: 'Result1.png', thumb: 'Result1.webp' }
        ];

        const photoSizes = [
            [900, 1200], [1200, 1200], [1199, 1200], [1200, 1147],
            [978, 1200], [1200, 954], [1200, 800], [1200, 900],
            [1200, 800], [802, 1200], [1200, 800], [1200, 800],
            [1200, 885], [1200, 800], [1200, 800], [800, 1200],
            [1200, 800], [1200, 800], [1200, 800], [800, 1200],
            [1200, 800], [768, 1152], [849, 1200]
        ];

        const gallery = document.querySelector('.gallery');
        const cylinder = gallery.querySelector('.cylinder');
        const dialog = document.querySelector('dialog');
        const viewer = dialog.querySelector('img');
        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
        const cards = new Map();
        const angleStep = 24;
        const edgeAcceleration = 1.6;
        let current = 0;
        let position = 0;
        let target = 0;
        let frame = 0;
        let lastFrameTime = 0;
        let lastTouchY = null;
        let touchTravel = 0;
        let suppressClickUntil = 0;

        const wrap = index => ((index % photos.length) + photos.length) % photos.length;

        function makeCard(virtualIndex) {
            const index = wrap(virtualIndex);
            const photo = photos[index];
            const button = document.createElement('button');
            const img = document.createElement('img');
            button.className = 'photo';
            button.type = 'button';
            button.dataset.lane = Math.abs(virtualIndex % 2) === 0 ? 'top' : 'bottom';
            button.setAttribute('aria-label', `Open photograph ${index + 1} of ${photos.length}`);
            img.src = `images/compressed/${encodeURIComponent(photo.thumb)}`;
            img.alt = `Jeff Jiang photograph ${index + 1}`;
            img.width = photoSizes[index][0];
            img.height = photoSizes[index][1];
            img.decoding = 'async';
            img.loading = 'eager';
            button.append(img);
            button.addEventListener('click', () => {
                if (performance.now() >= suppressClickUntil) openPhoto(index);
            });
            cylinder.append(button);
            return button;
        }

        function render() {
            const center = Math.round(position);
            for (let index = center - 5; index <= center + 5; index++) {
                if (!cards.has(index)) cards.set(index, makeCard(index));
            }

            for (const [index, card] of cards) {
                if (Math.abs(index - center) > 5) {
                    card.remove();
                    cards.delete(index);
                    continue;
                }
                const relative = index - position;
                const angle = relative * (angleStep + edgeAcceleration * relative * relative);
                const distance = Math.abs(angle);
                const available = distance < 90;
                card.style.transform = `translate(-50%, -50%) rotateY(${angle}deg) translateZ(calc(-1 * var(--radius)))`;
                card.style.visibility = available ? 'visible' : 'hidden';
                card.style.pointerEvents = available ? 'auto' : 'none';
                card.tabIndex = available ? 0 : -1;
                card.setAttribute('aria-hidden', available ? 'false' : 'true');
            }

        }

        function animate(time) {
            frame = 0;
            const elapsed = lastFrameTime ? Math.min(64, time - lastFrameTime) : 16;
            lastFrameTime = time;
            const difference = target - position;
            position = reducedMotion.matches ? target : position + difference * (1 - Math.exp(-elapsed / 95));

            if (Math.abs(target - position) < .001) {
                position = target;
                lastFrameTime = 0;
            }
            render();
            if (position !== target) frame = requestAnimationFrame(animate);
        }

        function move(amount) {
            target += amount;
            if (!frame) frame = requestAnimationFrame(animate);
        }

        function updateGeometry() {
            gallery.style.setProperty('--radius', `${Math.max(300, Math.min(900, window.innerWidth * .68))}px`);
            gallery.style.setProperty('--perspective', `${Math.max(700, window.innerWidth * 1.05)}px`);
            render();
        }

        gallery.addEventListener('wheel', event => {
            if (dialog.open || event.ctrlKey) return;
            event.preventDefault();
            const pixels = event.deltaY * (event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? window.innerHeight : 1);
            move(Math.max(-2, Math.min(2, pixels / 320)));
        }, { passive: false });

        gallery.addEventListener('touchstart', event => {
            if (event.touches.length === 1) {
                lastTouchY = event.touches[0].clientY;
                touchTravel = 0;
            }
        }, { passive: true });

        gallery.addEventListener('touchmove', event => {
            if (lastTouchY === null || event.touches.length !== 1) return;
            const nextY = event.touches[0].clientY;
            const distance = lastTouchY - nextY;
            lastTouchY = nextY;
            touchTravel += Math.abs(distance);
            if (touchTravel <= 8) return;
            event.preventDefault();
            suppressClickUntil = performance.now() + 500;
            move(distance / 250);
        }, { passive: false });

        gallery.addEventListener('touchend', () => {
            if (touchTravel > 8) suppressClickUntil = performance.now() + 500;
            lastTouchY = null;
            touchTravel = 0;
        });
        gallery.addEventListener('touchcancel', () => { lastTouchY = null; touchTravel = 0; });

        document.addEventListener('keydown', event => {
            if (dialog.open || event.target.closest('.topbar')) return;
            if (event.key === 'ArrowDown' || event.key === 'ArrowRight') {
                event.preventDefault();
                move(1);
            } else if (event.key === 'ArrowUp' || event.key === 'ArrowLeft') {
                event.preventDefault();
                move(-1);
            }
        });

        window.addEventListener('resize', updateGeometry);
        updateGeometry();

        function openPhoto(index) {
            current = (index + photos.length) % photos.length;
            viewer.src = `images/fulls/${encodeURIComponent(photos[current].full)}`;
            viewer.alt = `Jeff Jiang photograph ${current + 1}`;
            if (!dialog.open) dialog.showModal();
        }

        dialog.querySelector('.close').addEventListener('click', () => dialog.close());
        dialog.querySelector('.prev').addEventListener('click', () => openPhoto(current - 1));
        dialog.querySelector('.next').addEventListener('click', () => openPhoto(current + 1));
        dialog.addEventListener('click', event => {
            if (event.target === dialog || event.target.classList.contains('lightbox')) dialog.close();
        });
        document.addEventListener('keydown', event => {
            if (!dialog.open) return;
            if (event.key === 'ArrowLeft') openPhoto(current - 1);
            if (event.key === 'ArrowRight') openPhoto(current + 1);
        });
    </script>
</body>
</html>
